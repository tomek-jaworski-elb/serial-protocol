services:
    server:
        build: .
        restart: unless-stopped
        container_name: serial-ports-server
        environment:
            - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
            - rs.comports=COM1,S0
            - rs.baud_rate=9600
            - rs.message_delimiter=13,10  # 10 = \n, 13 = \r
            - ws.heartbeat.interval=2000  # value in ms > 1
            - chart.ship.position-smoothing-ms=300  # /chart: ms to ease a hull to its new position and heading; 0 = jump at once
            - ip.db-client=192.168.2.4:8085
            - TRACKS_LOG_ZONE=UTC
        ports:
            - "8081:443"
        networks:
          backend:
        healthcheck:
          test: ["CMD", "netcat", "-z", "localhost", "443"]
          interval: 5s
          timeout: 5s
          retries: 3
          start_period: 10s
        volumes:
            - logs:/app/logs
        devices:
            - /dev/ttyS0:/dev/ttyS0
            - /dev/ttyS2:/dev/ttyS2
            - /dev/ttyS1:/dev/ttyS1
#            - /dev/ttyACM0:/dev/ttyACM0
            - /dev:/dev
        privileged: true
        # No `user:` here: the image's entrypoint starts as root, joins the group that owns the
        # serial devices and then runs the app as aisuser.
        logging:
          driver: "json-file"
          options:
            max-size: "10m"
            max-file: "10"
        depends_on:
          mariadb:
            condition: service_healthy
    mariadb:
      image: mariadb:11.8
      restart: unless-stopped
      container_name: mariadb
      environment:
        - MARIADB_USER=user
        - MARIADB_PASSWORD=password
        - MARIADB_DATABASE=certificates
        - MARIADB_ROOT_PASSWORD=root
        # Runs mariadb-upgrade on start when the data volume was written by an older server
        # (the volume below predates 11.8). Without it the server starts but keeps warning
        # about system tables from the previous version.
        - MARIADB_AUTO_UPGRADE=1
      volumes:
        - mariadb-data:/var/lib/mysql
      expose:
        - "3306"
      ports:
        - "3306:3306"
      networks:
        - backend
      healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 5s
        timeout: 5s
        retries: 3
        start_period: 10s
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "10"

networks:
  backend:
    name: backend
    attachable: true
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"

volumes:
  mariadb-data:
    name: db-data
  server-data:
    name: server-data
  logs:
    name: server-logs

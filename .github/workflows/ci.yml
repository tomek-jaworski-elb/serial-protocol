name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x mvnw
          fi

      - name: Run tests
        run: |
          if [ -f "./mvnw" ] && [ -f "./.mvn/wrapper/maven-wrapper.properties" ]; then
            ./mvnw -B test
          else
            mvn -B test
          fi

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x mvnw
          fi

      - name: Build application package
        run: |
          if [ -f "./mvnw" ] && [ -f "./.mvn/wrapper/maven-wrapper.properties" ]; then
            ./mvnw -B -DskipTests package
          else
            mvn -B -DskipTests package
          fi

  docker-smoke-test:
    name: Docker smoke test (app startup)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x mvnw
          fi

      - name: Build application package
        run: |
          if [ -f "./mvnw" ] && [ -f "./.mvn/wrapper/maven-wrapper.properties" ]; then
            ./mvnw -B -DskipTests package
          else
            mvn -B -DskipTests package
          fi

      - name: Build and start containers
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for application container to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' serial-protocol-ci 2>/dev/null || echo "starting")
            echo "[$i] server container health: $status"
            if [ "$status" = "healthy" ]; then
              echo "Application started successfully."
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Application container became unhealthy."
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for the application container to become healthy."
          exit 1

      - name: Show container status
        if: always()
        run: docker compose -f docker-compose.ci.yml ps

      - name: Show container logs
        if: always()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Tear down containers
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

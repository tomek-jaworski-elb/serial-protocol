<!DOCTYPE html>
<html lang="en">
<head>
    <th:block th:replace="~{fragment::headContent}"></th:block>
    <title th:text="${@environment.getProperty('spring.application.name')} + ' : Chart'">Chart</title>
    <link th:href="@{/css/chart.css}" rel="stylesheet"/>
    <link rel="preload" as="image" type="image/avif" th:href="@{/img/MapaSilm_2666x4000.avif}"/>
</head>
<body>
<header th:replace="~{fragment::header}"></header>
<!-- controls live outside #konvaContainer: Konva clears the stage container content on init -->
<div class="map-wrapper">
    <!--
      .map-pane is the positioning context for .map-controls. Without it the controls
      anchor to .map-wrapper, which on desktop is a flex row that also spans the ship
      list, so right:10px placed the zoom buttons over the sidebar instead of the map.
    -->
    <div class="map-pane">
        <div class="canvas-container" id="konvaContainer"></div>
        <div class="map-controls btn-group-vertical" role="group" aria-label="Map zoom controls">
            <button type="button" id="zoomInBtn" class="btn btn-light border" title="Zoom in">+</button>
            <button type="button" id="zoomOutBtn" class="btn btn-light border" title="Zoom out">&minus;</button>
            <button type="button" id="zoomResetBtn" class="btn btn-light border" title="Reset view">&#8634;</button>
            <!--/*
              Chart orientation, shown only while following. It carries the mode as TEXT: there is
              no honest picture of the difference between where the bow points and where the ship
              actually travels, and HDG/COG are the terms that say it without ambiguity - plotter
              vendors disagree about whether "course up" means one or the other.
              The label is the EFFECTIVE orientation, so below the speed gate it reads HDG even
              though COG is selected; chart-script.js marks that case so a fallback never looks
              like a choice. Starts hidden - nothing to orient until a ship is followed.
            */-->
            <button type="button" id="orientationBtn" class="btn btn-light border orientation-btn"
                    aria-label="Chart orientation" hidden>COG</button>
            <!--/*
              Compass, shown only while the chart is rotated - which here means only while
              following. Every mapping service checked (Google Maps, MapLibre, Mapbox) hides its
              compass at north and makes it a button meaning "reset bearing to north"; north here
              means not following, so that is what tapping it does.

              Two-tone needle: north accented, south in the grey already used for a dark LED.
              The N rides round the dial with the needle but its own glyph stays upright, which
              is why it sits in a second group with the rotation undone - a letter that turns
              with the needle is upside down at heading 180, and that is exactly why Google and
              Apple drop the letter altogether. Both transforms are written by chart-script.js.
            */-->
            <button type="button" id="compassBtn" class="btn btn-light border compass-btn"
                    aria-label="Reset map to north" hidden>
                <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
                    <circle class="compass-dial" cx="20" cy="20" r="13"/>
                    <!--/*
                      Two triangles that share a base across the centre, each SYMMETRIC about the
                      needle's own axis. The first version used one-sided slivers, which drew a
                      bent dart rather than a needle and read as a graphical fault.
                      Tips stop at radius 10 so the N, which rides at radius 15, has room to sit
                      beyond the north tip instead of on top of it.
                    */-->
                    <g id="compassNeedle">
                        <path class="compass-north" d="M20 10 L23.5 20 L16.5 20 Z"/>
                        <path class="compass-south" d="M20 30 L23.5 20 L16.5 20 Z"/>
                    </g>
                    <g id="compassLabel">
                        <text class="compass-n" x="0" y="0" text-anchor="middle"
                              dominant-baseline="middle">N</text>
                    </g>
                </svg>
            </button>
        </div>
        <!--/*
          Follow chip. Two elements, never one: the BUTTON carries a fixed label and leaves the
          mode, and the status beside it - outside the button - carries the age of the last
          message. A button whose content changes every few seconds has an accessible name that
          changes with it, which is the same objection that kept the ship row from becoming a
          control. The age is a status, not an action.

          Neither element is an aria-live region: at about one message a second that would be an
          endless stream of announcements, the trap the packet counter already documents. Only
          crossing the silence threshold is worth announcing, as a state change.

          The chip is a button at every window width on purpose. An element that is a control at
          one viewport size and inert at another is a worse promise than one consistent button -
          and on mobile, where the ship list closes on engaging, it is the only visible way out.
        */-->
        <div class="follow-chip" id="followChip" hidden>
            <!--/* chart-script.js appends the ship name the moment the chip is shown; until then this
                 is what the button does, rather than a word it never displays. */-->
            <button type="button" id="followChipBtn" class="follow-chip-btn">Stop following</button>
            <span class="follow-chip-status" id="followChipStatus">live</span>
        </div>
        <!--/*
          Sits OUTSIDE the chip on purpose. The chip itself must never be a live region -
          at about a message a second the age beside the button would be an endless stream
          of announcements - but a ship going quiet for a minute is worth saying once. This
          element is written only when that state flips, in either direction, so a reader
          hears "no data" once and "receiving again" once.
        */-->
        <span class="visually-hidden" id="followAlert" aria-live="polite"></span>
    </div>
    <button type="button" class="ship-list-trigger d-lg-none" id="shipListTriggerBtn" aria-controls="shipListPanel" aria-expanded="false">
        Ships
    </button>

    <!--
      Ship list: ONE list in the DOM (th:id values led{id}/speed{id}/heading{id}/rs_model{id}_no
      are unchanged from the old legend panel, so chart-script.js needs no id changes). CSS turns
      it into a bottom sheet on mobile (fixed, off-screen until .open — toggled by bindShipListToggle()
      in chart-script.js, no Bootstrap offcanvas here on purpose: two separate offcanvas/sidebar
      copies would each need their own ids, and getElementById only ever finds the first one) and a
      static sidebar next to the map on desktop (chart.css, >= lg).
      heading{id} starts as "—": no ship has sent a message yet (offline). The first
      fillFieldValues() call for that ship overwrites it with a real value and it never
      reverts, matching the "online ships always show a course" rule even at speed ~0.
    -->
    <div class="ship-list-backdrop d-lg-none" id="shipListBackdrop"></div>
    <aside class="ship-list-panel" id="shipListPanel" aria-label="Ship list">
        <div class="ship-list-panel-header d-lg-none">
            <h5 class="m-0">Ships</h5>
            <button type="button" class="btn-close" id="shipListCloseBtn" aria-label="Close"></button>
        </div>
        <ul class="ship-list list-unstyled m-0">
            <li th:each="ship : ${shipModels}" class="ship-row" th:style="'--ship-color: ' + ${ship.color}">
                <!--/*
                  Follow toggle, first in the row on purpose: the toggles then line up in a
                  column down the left edge while the LED dots keep theirs down the right,
                  and neither indicator has to move.

                  aria-disabled, not disabled. A ship that has never reported cannot be
                  followed (there is no position to point a camera at), but it becomes
                  followable the moment its first message lands. With `disabled` the control
                  would pop into the keyboard's tab order at that moment out of nowhere;
                  aria-disabled leaves it findable throughout. The price is that it does NOT
                  block clicks or focus, so chart-script.js checks the attribute itself.

                  The accessible name is on the BUTTON and stays constant — the pressed
                  state is carried by aria-pressed, not by the wording. This is also why the
                  toggle is its own element rather than the whole row being the control: the
                  row holds a packet counter that changes about once a second, and a button
                  wrapping it would have an accessible name that changed with it.
                */-->
                <!--/*
                  The tooltip is Bootstrap's, not the browser's, for one reason: a native `title`
                  is placed by the browser — under the cursor and to the right — and cannot be
                  asked to sit above the control. It also only ever appears on hover, where this
                  one answers keyboard focus too.

                  data-bs-container="body" is load-bearing, not decoration. Bootstrap otherwise
                  inserts the tooltip next to its trigger, which here means inside the ship list —
                  and on mobile that panel is an `overflow-y: auto` sheet, which would clip the
                  tooltip away at its top edge. Invisible in the markup, invisible on desktop, and
                  the first row of a scrolled sheet is where it would have been noticed.

                  data-bs-title rather than title, so the native tooltip cannot flash before
                  Bootstrap takes over. The text starts at the unavailable wording because that is
                  the truth at render time: no ship has reported yet. chart-script.js rewrites it
                  on the first message and on every state change after.
                */-->
                <button type="button" class="follow-toggle" th:id="'follow' + ${ship.id}"
                        th:aria-label="'Follow ' + ${ship.name}"
                        data-bs-placement="top" data-bs-container="body"
                        th:data-bs-title="${ship.name} + ' has not reported yet'"
                        aria-pressed="false" aria-disabled="true">
                    <svg class="follow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle class="follow-ring" cx="12" cy="12" r="7"/>
                        <path class="follow-ticks" d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>
                        <circle class="follow-dot" cx="12" cy="12" r="2.6"/>
                    </svg>
                </button>
                <span class="ship-chip"></span>
                <div class="ship-info">
                    <div class="ship-name" th:text="${ship.name}">Ship Name</div>
                    <div class="ship-course">
                        <svg th:id="'arrow' + ${ship.id}" class="ship-arrow" viewBox="0 0 24 24" style="visibility:hidden">
                            <path d="M12 2 L18 20 L12 16 L6 20 Z"/>
                        </svg>
                        <span th:id="'heading' + ${ship.id}" class="course-deg">&mdash;</span>
                        <span class="course-sep">&middot;</span>
                        <span th:id="'speed' + ${ship.id}" class="course-speed">0.0</span><span class="course-unit"> kn</span>
                    </div>
                </div>
                <!--/*
                  A parser-level comment: Thymeleaf strips it, so this sits inside th:each
                  without being shipped once per ship -- and its text cannot satisfy the
                  markup assertions in ChartShipListTest, which search the rendered HTML.

                  Counter before the dot so every dot lands on the row's outer edge and the six
                  of them line up vertically -- the point of the indicator is being seen without
                  looking straight at it. chart-script.js addresses both by id, so their DOM
                  order is nothing to it.

                  The counter must not be given Bootstrap's sight-hiding utility class, which is
                  how it spent the first release: that class clips content away with !important,
                  which no other rule can undo, while the element keeps its full measured width.
                  It looks correct to everything except the eye.

                  The bare number is named by the visually-hidden text in front of it, not by its
                  title. title on a non-interactive span never appears on touch -- and the mobile
                  bottom sheet is the whole mobile UI -- and because the span has text of its own
                  a title becomes the accessible DESCRIPTION, which readers routinely skip at
                  default verbosity. The title stays only for the hover it does serve.
                  aria-label is not an option either: on an element with text it REPLACES that
                  text, so a reader would hear the label and never the count. And the counter must
                  never be announced on change -- at ~1 message/s per ship that is six numbers a
                  second.
                */-->
                <span class="visually-hidden" th:text="'Packets received from ' + ${ship.name} + ':'">Packets received:</span>
                <span th:id="'rs_model' + ${ship.id} + '_no'" class="rx-count"
                      th:title="'Packets received from ' + ${ship.name}">000</span>
                <span th:id="'led' + ${ship.id}" class="led-dot"></span>
            </li>
        </ul>
    </aside>
</div>
<!-- Raw per-message debug line (last ship only) — off by default, not part of the Fleet Board UI -->
<div class="container-fluid mt-3 d-flex justify-content-end">
    <button type="button" class="btn btn-link btn-sm text-muted p-0" id="diagnosticsToggleBtn">Diagnostics</button>
</div>
<div class="container-fluid mt-1 d-none" id="textFieldWrapper">
    <p id="textField" class="form-control" style="white-space: normal; word-wrap: break-word;">Text</p>
</div>
<footer th:replace="~{fragment::footer}"></footer>
<script th:inline="javascript">
    const ENABLE_TEST_RUNS_VAR    = /*[[${isTestEnabled}]]*/ false;
    // Milliseconds a hull takes to slide to its newest reported position; 0 = no smoothing.
    // chart.ship.position-smoothing-ms, read at startup.
    const SHIP_POSITION_SMOOTHING_MS_VAR = /*[[${shipPositionSmoothingMs}]]*/ 300;
    // Below this speed a course over ground is meaningless and the camera uses heading.
    // chart.ship.cog-min-speed-kn, read at startup.
    const COG_MIN_SPEED_KN_VAR = /*[[${cogMinSpeedKn}]]*/ 1;
</script>
<script type="text/javascript" th:src="@{/js/konva-10_3_2/konva.min.js}"></script>
<script type="text/javascript" th:src="@{/js/chart-script.js}"></script>
</body>
</html>

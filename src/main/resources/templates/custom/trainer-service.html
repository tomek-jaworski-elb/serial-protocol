<!DOCTYPE html>
<html lang="en">
<head>
    <title th:text="${@environment.getProperty('spring.application.name')} + ' : Trainer'">Serial port server</title>
    <th:block th:replace="~{fragment::headContent}"></th:block>
    <link rel="stylesheet" th:href="@{/css/custom-crud.css}">
</head>
<body>
<header th:replace="~{fragment::header}"></header>
<div class="container mb-4">
    <th:block th:replace="~{fragment::toastNotifications}"></th:block>

    <div class="crud-toolbar">
        <h4 class="mb-0" id="trainerTableHeading">Trainer</h4>
        <div class="crud-toolbar-actions">
            <input id="tableFilterInput" type="text" class="form-control form-control-sm crud-filter"
                   placeholder="Filter on this page" aria-label="Filter rows on this page"
                   title="Filters only the rows shown on the current page">
            <span id="crudFilterScope" class="crud-filter-scope" aria-live="polite"></span>
            <span class="badge bg-secondary" th:text="${trainerPage.totalElements}" th:if="${trainerPage != null && trainerPage.totalElements > 0}">0</span>
            <!-- No data-max-records here on purpose. pdf.report.max-records is enforced as
                 size() > max, and the largest page size offered is 100, so the limit cannot
                 be reached from the UI — a warning would be noise. Wiring it up also proved
                 profile-dependent: the property is absent from the test profile, so it would
                 render in production and silently vanish in tests. crud-table-actions.js
                 still reads the attribute if it ever appears; it just stays dormant. -->
            <span id="crudSelectionCount" class="crud-selection-count" aria-live="polite"></span>
            <button id="printReportBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-printer me-1" viewBox="0 0 16 16">
                    <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
                    <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2zm3 1h4a1 1 0 0 1 1 1v2H5V3a1 1 0 0 1 1-1zm-3 8v-1h8v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-1zm8-5a1 1 0 0 0-1 1H4a1 1 0 0 0-1-1z"/>
                </svg>
                Print Report
            </button>
            <button id="showAddFormBtn" type="button" class="btn btn-primary btn-sm">Add</button>
        </div>
    </div>

    <!-- Add form -->
    <div id="addTrainerFormContainer" class="card mb-3 d-none">
        <div class="card-body">
            <h5 class="card-title">Add trainer</h5>
            <form method="post" enctype="multipart/form-data" th:action="@{/trainer-service/add}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="trainerName" class="form-label">Name <span class="text-danger">*</span></label>
                        <input id="trainerName" name="name" type="text" class="form-control" maxlength="100" required>
                    </div>
                    <div class="col-md-4">
                        <label for="trainerSurname" class="form-label">Surname <span class="text-danger">*</span></label>
                        <input id="trainerSurname" name="surname" type="text" class="form-control" maxlength="100" required>
                    </div>
                    <div class="col-md-4">
                        <label for="trainerNickname" class="form-label">Nickname</label>
                        <input id="trainerNickname" name="nickname" type="text" class="form-control" maxlength="100">
                    </div>
                    <div class="col-md-4">
                        <label for="trainerEmail" class="form-label">Email</label>
                        <input id="trainerEmail" name="email" type="email" class="form-control" maxlength="100">
                    </div>
                    <div class="col-md-4">
                        <label for="trainerPhoneNumber" class="form-label">Phone Number</label>
                        <input id="trainerPhoneNumber" name="phoneNumber" type="text" class="form-control" maxlength="26">
                    </div>
                    <div class="col-md-4">
                        <div th:replace="~{fragment::imageEditor(true, 'Optional. Up to 6 photos, JPG or PNG, 10&nbsp;MB total.')}"></div>
                    </div>
                    <div class="col-md-8">
                        <label for="trainerAddress" class="form-label">Address</label>
                        <input id="trainerAddress" name="address" type="text" class="form-control" maxlength="300">
                    </div>
                    <div class="col-12">
                        <label for="trainerNotes" class="form-label">Notes</label>
                        <textarea id="trainerNotes" name="notes" class="form-control" maxlength="1000" rows="2"></textarea>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-success btn-sm">Save</button>
                    <button id="hideAddFormBtn" type="button" class="btn btn-outline-secondary btn-sm">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Update form -->
    <div id="updateTrainerFormContainer" class="card mb-3 d-none">
        <div class="card-body">
            <h5 class="card-title">Update trainer</h5>
            <form method="post" enctype="multipart/form-data" th:action="@{/trainer-service/update}">
                <input id="updateTrainerId" name="id" type="hidden" required>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="updateTrainerName" class="form-label">Name <span class="text-danger">*</span></label>
                        <input id="updateTrainerName" name="name" type="text" class="form-control" maxlength="100" required>
                    </div>
                    <div class="col-md-4">
                        <label for="updateTrainerSurname" class="form-label">Surname <span class="text-danger">*</span></label>
                        <input id="updateTrainerSurname" name="surname" type="text" class="form-control" maxlength="100" required>
                    </div>
                    <div class="col-md-4">
                        <label for="updateTrainerNickname" class="form-label">Nickname</label>
                        <input id="updateTrainerNickname" name="nickname" type="text" class="form-control" maxlength="100">
                    </div>
                    <div class="col-md-4">
                        <label for="updateTrainerEmail" class="form-label">Email</label>
                        <input id="updateTrainerEmail" name="email" type="email" class="form-control" maxlength="100">
                    </div>
                    <div class="col-md-4">
                        <label for="updateTrainerPhoneNumber" class="form-label">Phone Number</label>
                        <input id="updateTrainerPhoneNumber" name="phoneNumber" type="text" class="form-control" maxlength="26">
                    </div>
                    <div class="col-md-4">
                        <div th:replace="~{fragment::imageEditor(true, 'Add more photos, up to 6 in total. JPG or PNG, 10&nbsp;MB per upload.')}"></div>
                    </div>
                    <div class="col-md-8">
                        <label for="updateTrainerAddress" class="form-label">Address</label>
                        <input id="updateTrainerAddress" name="address" type="text" class="form-control" maxlength="300">
                    </div>
                    <div class="col-12">
                        <label for="updateTrainerNotes" class="form-label">Notes</label>
                        <textarea id="updateTrainerNotes" name="notes" class="form-control" maxlength="1000" rows="2"></textarea>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-warning btn-sm">Update</button>
                    <button id="hideUpdateFormBtn" type="button" class="btn btn-outline-secondary btn-sm">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <!-- role/aria-labelledby/tabindex: without tabindex a keyboard user cannot scroll
         an overflowing table at all, which would leave the horizontal-scroll pattern
         we chose over card reflow unusable without a mouse. -->
    <div class="table-responsive" th:if="${!#lists.isEmpty(trainers)}"
         role="region" aria-labelledby="trainerTableHeading" tabindex="0">
        <table class="table table-striped table-hover align-middle filterable-table crud-table">
            <thead class="table-light">
            <tr>
                <th scope="col"><input type="checkbox" class="form-check-input" id="selectAllCheckbox" title="Select all"></th>
                <th scope="col" class="col-num">#</th>
                <th scope="col" data-sort="text">Name</th>
                <th scope="col" data-sort="text">Surname</th>
                <th scope="col" data-sort="text">Nickname</th>
                <th scope="col" data-sort="text">Email</th>
                <th scope="col" data-sort="text">Phone</th>
                <th scope="col">Images</th>
                <th scope="col">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="trainer, trainerStat : ${trainers}">
                <td><input type="checkbox" class="form-check-input row-select-checkbox" th:value="${trainer.id}"></td>
                <th scope="row" class="col-num" th:text="${trainerPage.number * pageSize + trainerStat.index + 1}">1</th>
                <!-- Avatar goes INSIDE the existing Name cell: adding a column would shift
                     cells[cellIndex], which table-filter-sort.js reads when sorting. -->
                <td>
                    <span class="avatar-wrap">
                        <img th:if="${trainer.avatarImageUuid != null}"
                             th:src="@{/custom/image/{uuid}(uuid=${trainer.avatarImageUuid},size='thumb')}"
                             width="32" height="32" loading="lazy" alt="" class="avatar">
                        <!-- Initials come from CSS generated content, not a text node: the filter
                             matches on row.textContent and sorting reads cell.textContent, so a
                             text node here would sort "Zofia" under "ZD" and make "ZD" match the
                             row. Hidden from screen readers because the Images column still
                             renders a "Missing" badge - if that badge ever goes, this must too. -->
                        <span th:unless="${trainer.avatarImageUuid != null}" class="avatar avatar-initials"
                              th:attr="data-initials=${trainer.initials}" aria-hidden="true"></span>
                        <span th:text="${trainer.name}">John</span>
                    </span>
                </td>
                <td th:text="${trainer.surname}">Doe</td>
                <td th:text="${trainer.nickname != null ? trainer.nickname : '—'}">jdoe</td>
                <td th:text="${trainer.email != null ? trainer.email : '—'}">john@example.com</td>
                <td th:text="${trainer.phoneNumber != null ? trainer.phoneNumber : '—'}">+48 000</td>
                <td>
                    <span class="badge text-bg-success" th:if="${trainer.imagesUuid != null && !trainer.imagesUuid.isEmpty()}" th:text="${trainer.imagesUuid.size() + ' assigned'}">1 assigned</span>
                    <span class="badge text-bg-secondary" th:unless="${trainer.imagesUuid != null && !trainer.imagesUuid.isEmpty()}">Missing</span>
                </td>
                <td>
                    <!-- One inline action, the rest behind a kebab: guidance caps inline
                         actions at 1-2, and this keeps the Actions column narrow enough
                         to stay usable on a phone. Read-only stays one tap away; the
                         mutating actions sit behind a deliberate second step. -->
                    <div class="crud-row-actions">
                        <button type="button" class="btn btn-outline-info btn-sm details-trainer-btn"
                                th:attr="data-id=${trainer.id},data-name=${trainer.name},data-surname=${trainer.surname},data-nickname=${trainer.nickname},data-email=${trainer.email},data-phone=${trainer.phoneNumber},data-address=${trainer.address},data-notes=${trainer.notes},data-images=${trainer.imagesUuidString}">
                            Details
                        </button>
                        <div class="dropdown">
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="dropdown"
                                    aria-expanded="false"
                                    th:attr="aria-label='More actions for ' + ${trainer.name} + ' ' + ${trainer.surname}">
                                &#8942;
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <button type="button" class="dropdown-item update-trainer-btn" data-image-source
                                            th:attr="data-id=${trainer.id},data-images=${trainer.imagesUuidString},data-primary-image=${trainer.avatarImageUuid},data-name=${trainer.name},data-surname=${trainer.surname},data-nickname=${trainer.nickname},data-email=${trainer.email},data-phone=${trainer.phoneNumber},data-address=${trainer.address},data-notes=${trainer.notes}">
                                        Update
                                    </button>
                                </li>
                                <li>
                                    <form method="post" class="m-0" th:action="@{/trainer-service/delete/{id}(id=${trainer.id})}">
                                        <button type="submit" class="dropdown-item text-danger"
                                                onclick="return confirm('Are you sure you want to delete this item?');">Delete</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragment :: pagination(${trainerPage}, '/trainer-service', ${pageSize})}"></div>

    <div class="alert alert-info text-center" th:if="${#lists.isEmpty(trainers)}">No trainers found.</div>
</div>

<!-- Details Modal -->
<div class="modal fade" id="trainerDetailsModal" tabindex="-1" aria-labelledby="trainerDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trainerDetailsModalLabel">Trainer details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-7">
                        <p class="mb-2"><strong>ID:</strong> <span id="detailsTrainerId">-</span></p>
                        <p class="mb-2"><strong>Name:</strong> <span id="detailsTrainerName">-</span></p>
                        <p class="mb-2"><strong>Surname:</strong> <span id="detailsTrainerSurname">-</span></p>
                        <p class="mb-2"><strong>Nickname:</strong> <span id="detailsTrainerNickname">-</span></p>
                        <p class="mb-2"><strong>Email:</strong> <span id="detailsTrainerEmail">-</span></p>
                        <p class="mb-2"><strong>Phone:</strong> <span id="detailsTrainerPhone">-</span></p>
                        <p class="mb-2"><strong>Address:</strong> <span id="detailsTrainerAddress">-</span></p>
                        <p class="mb-0"><strong>Notes:</strong> <span id="detailsTrainerNotes">-</span></p>
                    </div>
                    <div class="col-md-5">
                        <p class="mb-1"><strong>Images:</strong></p>
                        <div id="detailsTrainerImages" class="d-flex flex-wrap gap-2"></div>
                        <div id="detailsTrainerNoImages" class="small text-muted">No images assigned.</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<form id="pdfReportForm" method="post" th:action="@{/pdf/trainer}" target="_blank" style="display:none;">
    <input type="hidden" id="pdfReportIds" name="ids" value="">
</form>
<footer th:replace="~{fragment::footer}"></footer>
<script th:src="@{/js/common/table-filter-sort.js}"></script>
<script th:src="@{/js/common/crud-table-actions.js}"></script>
<script th:src="@{/js/common/image-editor.js}"></script>
<script>
    const showAddFormBtn = document.getElementById('showAddFormBtn');
    const hideAddFormBtn = document.getElementById('hideAddFormBtn');
    const addTrainerFormContainer = document.getElementById('addTrainerFormContainer');
    const updateTrainerFormContainer = document.getElementById('updateTrainerFormContainer');
    const hideUpdateFormBtn = document.getElementById('hideUpdateFormBtn');
    const updateButtons = document.querySelectorAll('.update-trainer-btn');
    const updateTrainerId = document.getElementById('updateTrainerId');
    const updateTrainerName = document.getElementById('updateTrainerName');
    const updateTrainerSurname = document.getElementById('updateTrainerSurname');
    const updateTrainerNickname = document.getElementById('updateTrainerNickname');
    const updateTrainerEmail = document.getElementById('updateTrainerEmail');
    const updateTrainerPhoneNumber = document.getElementById('updateTrainerPhoneNumber');
    const updateTrainerAddress = document.getElementById('updateTrainerAddress');
    const updateTrainerNotes = document.getElementById('updateTrainerNotes');
    const detailsButtons = document.querySelectorAll('.details-trainer-btn');
    const trainerDetailsModal = document.getElementById('trainerDetailsModal');
    const detailsTrainerId = document.getElementById('detailsTrainerId');
    const detailsTrainerName = document.getElementById('detailsTrainerName');
    const detailsTrainerSurname = document.getElementById('detailsTrainerSurname');
    const detailsTrainerNickname = document.getElementById('detailsTrainerNickname');
    const detailsTrainerEmail = document.getElementById('detailsTrainerEmail');
    const detailsTrainerPhone = document.getElementById('detailsTrainerPhone');
    const detailsTrainerAddress = document.getElementById('detailsTrainerAddress');
    const detailsTrainerNotes = document.getElementById('detailsTrainerNotes');
    const detailsTrainerImages = document.getElementById('detailsTrainerImages');
    const detailsTrainerNoImages = document.getElementById('detailsTrainerNoImages');

    const trainerDetailsModalInstance =
        trainerDetailsModal && window.bootstrap && window.bootstrap.Modal
            ? window.bootstrap.Modal.getOrCreateInstance(trainerDetailsModal) : null;

    const nullOrDash = (v) => (v && v !== 'null' ? v : '-');


    if (showAddFormBtn && hideAddFormBtn && addTrainerFormContainer) {
        showAddFormBtn.addEventListener('click', () => {
            addTrainerFormContainer.classList.remove('d-none');
            if (updateTrainerFormContainer) updateTrainerFormContainer.classList.add('d-none');
            addTrainerFormContainer.scrollIntoView({behavior: 'smooth', block: 'start'});
        });
        hideAddFormBtn.addEventListener('click', () => addTrainerFormContainer.classList.add('d-none'));
    }

    if (hideUpdateFormBtn && updateTrainerFormContainer) {
        hideUpdateFormBtn.addEventListener('click', () => updateTrainerFormContainer.classList.add('d-none'));
    }

    if (updateButtons.length > 0 && updateTrainerFormContainer) {
        updateButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                updateTrainerId.value = btn.dataset.id || '';
                updateTrainerName.value = btn.dataset.name || '';
                updateTrainerSurname.value = btn.dataset.surname || '';
                updateTrainerNickname.value = btn.dataset.nickname !== 'null' ? (btn.dataset.nickname || '') : '';
                updateTrainerEmail.value = btn.dataset.email !== 'null' ? (btn.dataset.email || '') : '';
                updateTrainerPhoneNumber.value = btn.dataset.phone !== 'null' ? (btn.dataset.phone || '') : '';
                updateTrainerAddress.value = btn.dataset.address !== 'null' ? (btn.dataset.address || '') : '';
                updateTrainerNotes.value = btn.dataset.notes !== 'null' ? (btn.dataset.notes || '') : '';
                updateTrainerFormContainer.classList.remove('d-none');
                if (addTrainerFormContainer) addTrainerFormContainer.classList.add('d-none');
                updateTrainerFormContainer.scrollIntoView({behavior: 'smooth', block: 'start'});
            });
        });
    }

    if (detailsButtons.length > 0 && trainerDetailsModalInstance) {
        detailsButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                detailsTrainerId.textContent = nullOrDash(btn.dataset.id);
                detailsTrainerName.textContent = nullOrDash(btn.dataset.name);
                detailsTrainerSurname.textContent = nullOrDash(btn.dataset.surname);
                detailsTrainerNickname.textContent = nullOrDash(btn.dataset.nickname);
                detailsTrainerEmail.textContent = nullOrDash(btn.dataset.email);
                detailsTrainerPhone.textContent = nullOrDash(btn.dataset.phone);
                detailsTrainerAddress.textContent = nullOrDash(btn.dataset.address);
                detailsTrainerNotes.textContent = nullOrDash(btn.dataset.notes);
                detailsTrainerImages.innerHTML = '';
                // The DTO hands over a plain comma-separated list now, so there is
                // nothing to unwrap.
                const imageUuids = (btn.dataset.images || '').split(',').filter(Boolean);
                if (imageUuids.length > 0) {
                    detailsTrainerNoImages.classList.add('d-none');
                    imageUuids.forEach((uuid) => {
                        const img = document.createElement('img');
                        // Displayed at 110px, so the 160px thumbnail is more than enough;
                        // the original is a full-size camera photo.
                        img.src = `/custom/image/${uuid}?size=thumb`;
                        // Descriptive alt: this image stands on its own in the modal
                        // rather than sitting beside the name, so "Trainer image"
                        // would carry no information at all.
                        img.alt = `Photo of ${nullOrDash(btn.dataset.name)} ${nullOrDash(btn.dataset.surname)}`.trim();
                        // circular = a person (square is reserved for non-people)
                        img.className = 'img-thumbnail rounded-circle';
                        // width/height let the browser reserve the box before the
                        // image loads, so the modal doesn't jump as photos arrive
                        img.width = 110;
                        img.height = 110;
                        img.loading = 'lazy';
                        img.style.maxWidth = '110px';
                        img.style.maxHeight = '110px';
                        img.style.objectFit = 'cover';
                        detailsTrainerImages.appendChild(img);
                    });
                } else {
                    detailsTrainerNoImages.classList.remove('d-none');
                }

                trainerDetailsModalInstance.show();
            });
        });
    }

    // Row selection and PDF report wiring now live in
    // /js/common/crud-table-actions.js, shared by all custom/* pages. That
    // version also excludes rows hidden by the filter, which this one did not:
    // select-all used to tick filtered-away rows too, so the report could
    // contain records the user had filtered out and never saw.
</script>
</body>
</html>

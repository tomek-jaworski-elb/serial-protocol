<!DOCTYPE html>
<html lang="en">
<head>
    <title th:text="${@environment.getProperty('spring.application.name')} + ' : Change password'">Serial port server</title>
    <th:block th:replace="~{fragment::headContent}"></th:block>
    <link rel="stylesheet" th:href="@{/css/custom-crud.css}">
</head>
<body>
<header th:replace="~{fragment::header}"></header>
<div class="container mb-4">
    <th:block th:replace="~{fragment::toastNotifications}"></th:block>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-body">
                    <h4 class="card-title" id="changePasswordHeading">Change password</h4>
                    <div class="alert alert-warning" role="status" th:if="${forced}">You must change your password before continuing.</div>
                    <form method="post" th:action="@{/account/password}" aria-labelledby="changePasswordHeading">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Current password</label>
                            <div class="input-group">
                                <input id="currentPassword" name="current" type="password" class="form-control"
                                       autocomplete="current-password" required>
                                <button type="button" class="btn btn-outline-secondary" data-toggle-password="#currentPassword"
                                        data-label="current password" aria-controls="currentPassword" aria-label="Show current password">Show</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New password</label>
                            <div class="input-group">
                                <input id="newPassword" name="newPassword" type="password" class="form-control"
                                       autocomplete="new-password" aria-describedby="newPasswordHelp" required>
                                <button type="button" class="btn btn-outline-secondary" data-toggle-password="#newPassword"
                                        data-label="new password" aria-controls="newPassword" aria-label="Show new password">Show</button>
                            </div>
                            <div id="newPasswordHelp" class="form-text">At least 12 characters, at most 72 bytes. No other rules.</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm new password</label>
                            <div class="input-group">
                                <input id="confirmPassword" name="confirm" type="password" class="form-control"
                                       autocomplete="new-password" required>
                                <button type="button" class="btn btn-outline-secondary" data-toggle-password="#confirmPassword"
                                        data-label="password confirmation" aria-controls="confirmPassword" aria-label="Show password confirmation">Show</button>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-success btn-sm">Save</button>
                            <a th:unless="${forced}" th:href="@{/}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragment::footer}"></footer>
<script th:src="@{/js/common/password-toggle.js}"></script>
</body>
</html>

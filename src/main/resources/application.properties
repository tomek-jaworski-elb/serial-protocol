spring.application.name=@description@
application.version=@project.version@
application.build=@revision@
rs.baud_rate=9600
rs.comports=COM1,S0
rs.message_delimiter=13,10
#13 = enter, 10 = linefeed
#server.error.whitelabel.enabled=true
server.error.include-stacktrace=always
#server.error.path=/error
logging.file.path=logs
ws.endpoint=/echo
spring.thymeleaf.enabled=true
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/
ws.heartbeat.interval=1000

# Open-page count: a page sends a keep-alive every 30s, and one that has not been heard
# from within this is treated as gone. Generous, because a background tab has its timers
# throttled to about once a minute.
ws.session.silence-limit=150s
ws.session.silence-check=30000
server.port=443
server.http.ports=80,8080
server.http.redirect.enabled=true
ip.db-client=127.0.0.1:8085
rest.service.enabled=false
name.service.password=$2a$04$WwPwpSBf8IlZP3NVLnyfru38YnkCUaG4hHOoMYjkVxwDgGJ9xghjy
rest.service.credentials=admin:admin
logging.tracking.file.name=tracking

## default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

## MariaDB (H2 in tests, see src/test/resources/application.properties)
spring.datasource.url=jdbc:mariadb://${DB_HOST_IP:mariadb}:3306/certificates
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}

# The schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks that the
# mappings match it and refuses to start otherwise; it never alters a production database.
spring.jpa.hibernate.ddl-auto=validate
# An installation that predates Flyway already has every table: mark it as version 1 instead of
# running V1, then apply the later versions.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# SQL logging is off in production; for a local debugging session use
# logging.level.org.hibernate.SQL=DEBUG (and logging.level.org.hibernate.orm.jdbc.bind=TRACE for parameters).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.open-in-view=false

server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${CERT_PATH:cert/server.p12}
server.ssl.key-store-password=password
server.ssl.key-password=password
server.ssl.client-auth=want

server.servlet.session.timeout=15m

server.tomcat.uri-encoding=UTF-8

server.tomcat.accesslog.enabled=true

custom.server.credentials.name=${SERVER_USER:user}
custom.server.credentials.password=${SERVER_PASSWORD:user}
custom.server.credentials.admin.name=${SERVER_ADMIN_USER:admin}
custom.server.credentials.admin.password=${SERVER_ADMIN_PASSWORD:admin}

# threadpool configuration
threads.core-pool-size=2
threads.max-pool-size=10
threads.queue-capacity=100

# PDF Report
pdf.report.font.name=DejaVuSans
pdf.report.font.size.regular=10
pdf.report.font.size.small=8
pdf.report.font.size.heading=13
pdf.report.font.size.title=16
pdf.report.max-records=100

# Enable extended information in the web UI
web.ui.extended=true

# Multipart upload limits: the container limit is sized for a sync file; the per-photo cap is
# images.max-upload-size, enforced in code (MultipartImages).
spring.servlet.multipart.max-file-size=${sync.max-file-size}
spring.servlet.multipart.max-request-size=${sync.max-file-size}
images.max-upload-size=10MB

# Static resources HTTP caching (img, js, css)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# HTTP response compression (text resources)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# UDP Server
udp.server.port=${UDP_SERVER_PORT:2222}
udp.server.buffer-size=${UDP_SERVER_BUFFER-SIZE:65535}
udp.server.enabled=${UDP_SERVER_ENABLED:true}

# Milliseconds a ship silhouette takes to slide from its previous reported position to the newest
# one. Messages arrive about once a second, so 0 makes every hull teleport as it used to; in
# follow mode that step is taken by the whole chart instead. Read at page render - needs a restart.
chart.ship.position-smoothing-ms=${SHIP_POSITION_SMOOTHING_MS:300}

# Speed in knots below which course over ground is meaningless and the follow camera falls back
# to the reported heading. At 1 kn a ship covers ~0.5 m between messages, so position noise of a
# few tens of centimetres swings the derived course by tens of degrees.
chart.ship.cog-min-speed-kn=${COG_MIN_SPEED_KN:1.0}

# Lazy collections and proxies are loaded in batches (one IN query per 50 owners) instead of one
# query per row. The list pages rely on it: see ListPagesLoadNoImageBlobsTest.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Rebuild thumbnails whose generator version is stale once after start-up (ThumbnailBackfill).
images.thumbnail.backfill-on-start=true

# USB-stick synchronisation (docs/sync-spec.md). ACTIVE is the one installation that edits;
# READ_ONLY shows a warning bar on every page and reports its edits as collisions on import.
# Read at start; there is no switch in the UI.
sync.mode=${SYNC_MODE:ACTIVE}
# Shown in sync files and collision reports; blank = this computer's host name.
sync.node-name=${SYNC_NODE_NAME:}
# .bak files written before every import and on request; the newest sync.backup-keep stay (0 = all).
sync.backup-dir=${SYNC_BACKUP_DIR:./sync-backups}
sync.backup-keep=${SYNC_BACKUP_KEEP:20}
# Uploaded sync files wait here between the report and the apply; older than sync.work-ttl are removed.
sync.work-dir=${SYNC_WORK_DIR:${java.io.tmpdir}/serial-protocol-sync}
sync.work-ttl=2h
# Largest sync file the upload accepts (also the servlet multipart limit).
sync.max-file-size=2GB
